# Static SPA served behind the global Traefik proxy.
# Traefik terminates TLS and adds security headers / compression, so this
# server only needs to serve files and provide the SPA fallback.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets are safe to cache aggressively.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Never cache the HTML entry so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unknown path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Static SPA served behind the global Traefik proxy.
# Traefik terminates TLS and adds security headers / compression, so this
# server only needs to serve files and provide the SPA fallback.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets are safe to cache aggressively.
    # (^~ so the regex block below never overrides this.)
    location ^~ /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # nginx's mime.types has no entry for .webmanifest — set it explicitly
    # so browsers/Lighthouse don't see application/octet-stream.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires      1d;
    }

    # Root-level static files (favicons, og-image, resume…) — moderate cache.
    location ~* \.(png|svg|ico|pdf)$ {
        expires    7d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # Never cache the HTML entry so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unknown path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
